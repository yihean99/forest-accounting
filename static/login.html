<style data-pnid-children="V8EQFNBLkw4Ud635dp0OeR">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
    background-attachment: fixed;
    color: #2e4d3a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 15%, #ffb7c5 0%, #ffb7c5 3%, transparent 4%),
      radial-gradient(circle at 90% 20%, #ffd1dc 0%, #ffd1dc 2.5%, transparent 3.5%),
      radial-gradient(circle at 15% 80%, #ffb7c5 0%, #ffb7c5 2%, transparent 3%),
      radial-gradient(circle at 88% 70%, #ffe4ec 0%, #ffe4ec 2%, transparent 3%),
      radial-gradient(circle at 5% 50%, #fff59d 0%, #fff59d 2%, transparent 3%);
    pointer-events: none;
    z-index: 0;
  }
  .login-card {
    position: relative; z-index: 1;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 36px 28px 30px;
    width: 100%; max-width: 380px;
    box-shadow: 0 10px 30px rgba(76, 175, 80, 0.22);
    border: 1px solid rgba(165, 214, 167, 0.6);
  }
  .logo { text-align: center; margin-bottom: 22px; }
  .logo .icon-wrap {
    width: 84px; height: 84px; margin: 0 auto 10px;
    border-radius: 22px;
    background: linear-gradient(135deg, #c8e6c9, #81c784);
    padding: 6px;
    box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
  }
  .logo .icon-wrap img { width: 100%; height: 100%; border-radius: 16px; object-fit: cover; display: block; }
  .logo h1 { font-size: 24px; color: #2e7d32; font-weight: 700; letter-spacing: 2px; }
  .logo p { font-size: 13px; color: #689f38; margin-top: 6px; opacity: 0.85; }
  .mode-badge {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    background: #e8f5e9;
    color: #558b2f;
  }
  .mode-badge.cloud { background: #e3f2fd; color: #1565c0; }
  .mode-badge.local { background: #fff3e0; color: #e65100; }
  .tabs { display: flex; background: #f1f8e9; border-radius: 12px; padding: 4px; margin-bottom: 22px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 0;
    font-size: 15px; font-weight: 600; color: #689f38;
    cursor: pointer; border-radius: 9px; transition: all 0.25s;
    border: none; background: transparent; font-family: inherit;
  }
  .tab.active { background: #ffffff; color: #2e7d32; box-shadow: 0 2px 8px rgba(76, 175, 80, 0.15); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #4a6b4a; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 13px 15px; font-size: 16px;
    border: 1.5px solid #c5e1a5; border-radius: 12px; outline: none;
    font-family: inherit; color: #33691e; background: #f9fdf9;
    transition: all 0.2s;
  }
  .field input:focus {
    border-color: #43a047; background: #ffffff;
    box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.12);
  }
  .submit-btn {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 700;
    color: #ffffff;
    background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
    border: none; border-radius: 12px; cursor: pointer;
    transition: all 0.25s; font-family: inherit; margin-top: 6px;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(76, 175, 80, 0.4); }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .error-msg { color: #d32f2f; font-size: 13px; text-align: center; min-height: 18px; margin-top: 12px; }
  .tip { text-align: center; font-size: 12px; color: #9ccc9c; margin-top: 16px; line-height: 1.6; }

  /* ===== 新增：注册默认数据设置 ===== */
  .defaults-panel {
    background: #f9fdf9; border: 1.5px dashed #c5e1a5; border-radius: 14px;
    padding: 14px 14px 12px; margin-bottom: 16px;
  }
  .defaults-title {
    font-size: 12px; color: #689f38; font-weight: 600;
    margin-bottom: 10px; line-height: 1.5;
  }
  .def-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .def-item label {
    display: block; font-size: 12px; color: #4a6b4a; font-weight: 600; margin-bottom: 4px;
  }
  .def-item input {
    width: 100%; padding: 9px 10px; font-size: 15px; font-weight: 600;
    border: 1.5px solid #c5e1a5; border-radius: 9px; outline: none;
    font-family: inherit; color: #33691e; background: #ffffff; text-align: center;
    transition: all 0.2s;
  }
  .def-item input:focus {
    border-color: #43a047; box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.12);
  }
  .def-total {
    text-align: right; font-size: 13px; color: #4a6b4a; margin-top: 10px;
  }
  .def-total b { color: #f57f17; font-size: 16px; }

</style>
</head>

    <h1>森系记账本</h1>
    <p>记录每一笔小确幸</p>
    <span class="mode-badge" id="modeBadge">检测中…</span>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchMode('login')">登录</button>
    <button class="tab" id="tabRegister" onclick="switchMode('register')">注册</button>
  </div>

  <div class="field">
    <label id="usernameLabel">账号</label>
    <input autocomplete="username" id="username" placeholder="请输入账号" type="text">
  </div>

  <div class="field">
    <label>密码</label>
    <input autocomplete="current-password" id="password" onkeydown="if(event.key==='Enter') submit()" placeholder="请输入密码" type="password">
  </div>

  <div class="defaults-panel" id="defaultsPanel" style="display:none">
    <div class="defaults-title">设置本月默认数据（每月 1 号凌晨 4:00 自动恢复为这组数值，其余数值清零）</div>
    <div class="def-grid">
      <div class="def-item"><label>吃饭</label><input id="regEat" type="number" min="0" step="1" value="600"></div>
      <div class="def-item"><label>零食</label><input id="regSnack" type="number" min="0" step="1" value="100"></div>
      <div class="def-item"><label>想干啥干啥</label><input id="regWant" type="number" min="0" step="1" value="520"></div>
      <div class="def-item"><label>杂花</label><input id="regMisc" type="number" min="0" step="1" value="80"></div>
    </div>
    <div class="def-total">本月：<b><span id="regMonth">1300</span></b> 元</div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submit()">登 录</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="tip" id="tipText">数据将保存到云端，换设备登录同一账号即可查看</div>
</div>

<script>
  // ============= 自动检测后端模式 =============
  // 1) 优先尝试 /api/login（云端模式）；失败则降级为 localStorage 模式
  // 2) 本地模式下可注册多个账号，全部保存在同一个浏览器内

  const STORE_USERS = 'forestUsers';
  const STORE_TOKEN = 'forestToken';
  const STORE_USERNAME = 'forestUsername';
  const DEFAULT_DATA = { eat: 600, snack: 100, want: 520, misc: 80 };
  // ===== 跨页跳转 =====
  // 由 server.py 同源托管前端与后端，直接使用相对路径即可。
  function pageUrl(name) {
    return './' + name + '.html';
  }

  // ===== 后端地址 =====
  // 默认同源（server.py 同时托管前端时零配置）。
  // 前端单独托管在静态站、后端在别处时，首次访问带 ?api=https://后端地址 即可，
  // 之后会记在本地；也可以在构建时把 DEFAULT_API_BASE 写死。
  const DEFAULT_API_BASE = '';
  function apiBase() {
    let q = '';
    try {
      const m = /[?&]api=([^&]+)/.exec((typeof location !== 'undefined' && location.search) || '');
      if (m) q = decodeURIComponent(m[1]);
    } catch (e) { }
    if (q) store.set('forestApiBase', q);
    const base = q || store.get('forestApiBase') || DEFAULT_API_BASE;
    return String(base).replace(/\/+$/, '');
  }
  function apiUrl(path) { return apiBase() + path; }
  function usingRemoteApi() { return !!apiBase(); }

  // ===== localStorage 安全封装：被沙箱限制时退回内存，避免整页白屏 =====
  const memStore = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = String(v); } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; } }
  };


  let mode = 'login';
  let backend = 'detecting';  // cloud | local

  function el(id) { return document.getElementById(id); }
  function num(v) { const x = parseFloat(v); return isNaN(x) ? 0 : x; }
  function round2(v) { return Math.round(num(v) * 100) / 100; }
  function pad2(n) { return String(n).padStart(2, '0'); }

  // 注册时设置的默认数据
  function readDefaults() {
    return {
      eat: round2(el('regEat').value),
      snack: round2(el('regSnack').value),
      want: round2(el('regWant').value),
      misc: round2(el('regMisc').value)
    };
  }

  function updateRegMonth() {
    const d = readDefaults();
    el('regMonth').textContent = String(round2(d.eat + d.snack + d.want + d.misc));
  }

  // 新账号的初始账本数据：默认数据 + 本月预算 + 空账目
  function buildInitialData(defs) {
    const now = new Date();
    const month = now.getFullYear() + '-' + pad2(now.getMonth() + 1);
    return {
      version: 2,
      defaults: defs,
      monthKey: month,
      lastReset: Date.now(),
      lastEatDate: month + '-' + pad2(now.getDate()),
      budgets: Object.assign({}, defs),
      eatDaily: {},
      snackRecords: [],
      wantRecords: [],
      misc: { shower: 0, water: 0, washer: 0 },
      archives: []
    };
  }

  // 严格判断探测响应是不是我们后端返回的 JSON：
  // 纯静态托管对未知路径常回 200 + HTML，不能只看 res.ok
  async function isOurApi(res) {
    if (!res || !res.ok) return false;
    try {
      const j = await res.json();
      return !!j && typeof j === 'object' && ('success' in j);
    } catch (e) { return false; }
  }

  async function detectBackend() {
    let cloud = false;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 1800);
      const res = await fetch(apiUrl('/api/login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: '__probe__', password: '__probe__' }),
        signal: ctrl.signal
      });
      clearTimeout(t);
      cloud = await isOurApi(res);
    } catch (e) {
      cloud = false;
    }
    backend = cloud ? 'cloud' : 'local';
    if (cloud) {
      el('modeBadge').textContent = '☁️ 云端模式';
      el('modeBadge').className = 'mode-badge cloud';
      el('tipText').textContent = '数据将保存到云端，换设备登录同一账号即可查看';
    } else {
      el('modeBadge').textContent = '📱 本地模式';
      el('modeBadge').className = 'mode-badge local';
      el('tipText').textContent = '本地模式：账号和数据保存在当前浏览器中。换浏览器/设备需要重新注册';
    }
  }

  // 简易密码哈希（仅前端模拟"加密"，不要用于真实生产）
  async function hashPwd(pwd, salt) {
    const data = new TextEncoder().encode(salt + ':' + pwd);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function getUsers() {
    try { return JSON.parse(store.get(STORE_USERS) || '{}'); }
    catch { return {}; }
  }
  function saveUsers(users) { store.set(STORE_USERS, JSON.stringify(users)); }

  async function localRegister(username, password, defs) {
    const users = getUsers();
    if (users[username]) return { success: false, message: '账号已存在' };
    const salt = Math.random().toString(36).slice(2, 10);
    const pwd = await hashPwd(password, salt);
    const data = buildInitialData(defs);
    users[username] = { salt, pwd, data, createdAt: Date.now() };
    saveUsers(users);
    return { success: true, token: 'local:' + username, data: data };
  }

  async function localLogin(username, password) {
    const users = getUsers();
    const u = users[username];
    if (!u) return { success: false, message: '账号不存在，请先注册' };
    const pwd = await hashPwd(password, u.salt);
    if (pwd !== u.pwd) return { success: false, message: '密码错误' };
    return { success: true, token: 'local:' + username, data: u.data || {} };
  }

  // 已登录则直接进入主页面
  if (store.get(STORE_TOKEN)) {
    location.href = pageUrl('accounting');
  }

  detectBackend();
  ['regEat', 'regSnack', 'regWant', 'regMisc'].forEach(id => {
    const e2 = el(id);
    if (e2) e2.addEventListener('input', updateRegMonth);
  });

  function switchMode(m) {
    mode = m;
    el('tabLogin').classList.toggle('active', m === 'login');
    el('tabRegister').classList.toggle('active', m === 'register');
    el('submitBtn').textContent = m === 'login' ? '登 录' : '注 册';
    el('usernameLabel').textContent = m === 'login' ? '账号' : '设置账号';
    el('password').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
    el('defaultsPanel').style.display = m === 'register' ? 'block' : 'none';
    if (m === 'register') updateRegMonth();
    el('errorMsg').textContent = '';
  }

  function showError(msg) { el('errorMsg').textContent = msg; }

  async function cloudAuth(username, password) {
    const url = apiUrl(mode === 'login' ? '/api/login' : '/api/register');
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    });
    const result = await res.json();
    // 注册成功后，把「默认数据」初始化为该账号的账本数据
    if (result.success && mode === 'register') {
      const init = buildInitialData(readDefaults());
      try {
        await fetch(apiUrl('/api/data'), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': result.token },
          body: JSON.stringify({ data: init })
        });
        result.data = init;
      } catch (e) { }
    }
    return result;
  }

  async function doSubmit() {
    const username = el('username').value.trim();
    const password = el('password').value;
    if (!username || !password) {
      showError(mode === 'login' ? '请输入账号和密码' : '请填写账号和密码');
      return;
    }

    const btn = el('submitBtn');
    btn.disabled = true;
    btn.textContent = '请稍候…';

    try {
      if (backend === 'detecting') await detectBackend();
      let result;
      if (backend === 'cloud') {
        result = await cloudAuth(username, password);
      } else {
        result = mode === 'login'
          ? await localLogin(username, password)
          : await localRegister(username, password, readDefaults());
      }
      if (result.success) {
        store.set(STORE_TOKEN, result.token);
        store.set(STORE_USERNAME, username);
        await migrateIfNeeded(result.token, result.data, username);
        location.href = pageUrl('accounting');
        return;
      }
      showError(result.message || '操作失败');
    } catch (e) {
      // 兜底再走一次本地
      if (backend !== 'local') {
        backend = 'local';
        el('modeBadge').textContent = '📱 本地模式';
        el('modeBadge').className = 'mode-badge local';
      }
      try {
        const result = mode === 'login'
          ? await localLogin(username, password)
          : await localRegister(username, password, readDefaults());
        if (result.success) {
          store.set(STORE_TOKEN, result.token);
          store.set(STORE_USERNAME, username);
          await migrateIfNeeded(result.token, result.data, username);
          location.href = pageUrl('accounting');
          return;
        }
        showError(result.message || '操作失败');
      } catch (e2) {
        showError('操作失败：' + e2.message);
      }
    }
    btn.disabled = false;
    btn.textContent = mode === 'login' ? '登 录' : '注 册';
  }

  function submit() {
    const username = el('username').value.trim();
    const password = el('password').value;
    if (mode === 'register') {
      if (username.length < 2) { showError('账号至少 2 个字符'); return; }
      if (password.length < 4) { showError('密码至少 4 位'); return; }
    }
    doSubmit();
  }

  async function migrateIfNeeded(token, cloudData, uname) {
    const cloudEmpty = !cloudData || Object.keys(cloudData).length === 0;
    if (!cloudEmpty) return;
    // 只迁移一次旧版全局缓存，读后即删，避免多个账号互相串数据
    const localRaw = store.get('forestAccounting');
    if (!localRaw) return;
    store.del('forestAccounting');
    try {
      const data = JSON.parse(localRaw);
      if (backend === 'cloud') {
        await fetch(apiUrl('/api/data'), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token },
          body: JSON.stringify({ data: data })
        });
      } else {
        const users = getUsers();
        if (users[uname]) { users[uname].data = data; saveUsers(users); }
      }
    } catch (e) { }
  }

</script>

</body>
</html>
